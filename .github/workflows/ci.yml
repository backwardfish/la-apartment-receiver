name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify production artifact, tests, lint, and functions
        run: npm run verify
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false

  release-gate:
    if: always()
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require both platforms to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: test "$TEST_RESULT" = success && test "$SCAN_RESULT" = success

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Verify the published commit and non-provider boundaries
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/smoke-production.mjs https://la-apartment-receiver.netlify.app "$EXPECTED_REVISION" --wait
